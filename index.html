  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 35%, rgba(10,4,12,.55) 100%); }

  #title { font-family: "OpenDyslexic", var(--ui); font-weight: 700; font-size: clamp(18px, 4vw, 60px); letter-spacing: .12em; padding-left: .12em; opacity: .9; text-shadow: 0 0 18px var(--glow); }
  #time {
    font-family: var(--display); font-size: clamp(76px, min(22vw, 41vh), 480px); line-height: 1; white-space: nowrap;
    font-variant-numeric: tabular-nums; text-shadow: 0 0 10px var(--glow), 0 0 40px var(--glow), 0 4px 30px rgba(0,0,0,.6);
  }
  body.readable #time { font-family: "OpenDyslexic", var(--ui); font-weight: 700; font-size: clamp(60px, min(17vw, 34vh), 380px); }
  body.readable #time .d { width: .74em; }
  body.readable #time .c { width: .42em; }

<div class="vignette"></div>
<main class="stage">
  <div id="time">10:00</div>
</main>



<div id="promise">for real this time i promise</div>

<button id="langBtn" type="button" aria-label="Switch numbers" title="Switch English / Monstrous"></button>

<form id="panel" hidden>
  <h2>Timer settings</h2>
  <div class="hms">
    <label for="inH">Hours<input id="inH" type="number" min="0" max="99" value="0"></label>
    <label for="inM">Minutes<input id="inM" type="number" min="0" max="59" value="10"></label>
    <label for="inS">Seconds<input id="inS" type="number" min="0" max="59" value="0"></label>
  </div>
  <div class="row">
    <button id="cancelBtn" type="button">Cancel</button>
    <button class="primary" type="submit">Start timer</button>
  </div>
</form>

<script>
  const $ = id => document.getElementById(id);
  const DEF = { h: 0, m: 10, s: 0, title: "ARRIVAL IN", done: "ARRIVED", readable: true };
  let S = { ...DEF };
  try { Object.assign(S, JSON.parse(localStorage.getItem("arrivalTimer2") || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem("arrivalTimer2", JSON.stringify(S)); } catch (e) {} };

  const timeEl = $("time"), panel = $("panel");
  let total = 0, remaining = 0, endAt = 0, running = false;
  // Live mode: everyone counts down to the same moment (8:30 AM Pacific, Nov 6 2026).
  const TARGET = Date.parse("2026-11-06T08:30:00-08:00");
  let live = true;

  function apply() {
    total = Math.max(0, (+S.h || 0) * 3600 + (+S.m || 0) * 60 + (+S.s || 0)) * 1000;
    document.body.classList.toggle("readable", !!S.readable);
  }
  const pad = n => String(n).padStart(2, "0");
  function fmt(ms) {
    const t = Math.ceil(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }
  function render() {
    if (live) { remaining = Math.max(0, TARGET - Date.now()); running = remaining > 0; }
    else if (running) remaining = Math.max(0, endAt - Date.now());
    const done = remaining <= 0;
    if (done) running = false;
    const txt = done ? "Countdown will return at a future date" : fmt(remaining);
    if (txt !== timeEl.dataset.t) {
      timeEl.dataset.t = txt;
      timeEl.innerHTML = done ? "" : [...txt].map(c => `<span class="${c === ":" ? "c" : "d"}">${c}</span>`).join("");
      if (done) timeEl.textContent = txt;
    }
    timeEl.classList.toggle("done", done);
    $("promise").hidden = done;
    timeEl.classList.toggle("paused", !running && !done);
      document.title = done ? "Arrival Timer" : "Arrival Timer · " + fmt(remaining);
  }
  const start = () => { if (remaining > 0) { endAt = Date.now() + remaining; running = true; } };
  const pause = () => { if (!live && running) { remaining = Math.max(0, endAt - Date.now()); running = false; } };
  const restart = () => { if (live) return; remaining = total; running = false; start(); };
  const toggle = () => running ? pause() : start();
  const fullscreen = () => {
    try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
  };
  function openPanel() {
    $("inH").value = S.h; $("inM").value = S.m; $("inS").value = S.s;
    panel.hidden = false; $("inM").focus();
  }

  $("langBtn").onclick = () => {
    S.readable = !S.readable; save(); apply(); timeEl.dataset.t = ""; render();
    $("langBtn").setAttribute("aria-label", S.readable ? "Switch numbers to Monstrous" : "Switch numbers to English");
  };
  $("cancelBtn").onclick = () => { panel.hidden = true; };
  panel.addEventListener("submit", e => {
    e.preventDefault();
    const clamp = (v, max) => Math.min(max, Math.max(0, Math.floor(+v || 0)));
    S = { h: clamp($("inH").value, 99), m: clamp($("inM").value, 59), s: clamp($("inS").value, 59),
          done: S.done, readable: S.readable };
    save(); apply(); live = false; restart(); panel.hidden = true; render();
  });

  document.addEventListener("keydown", e => {
    if (e.target.closest("input")) { if (e.key === "Escape") panel.hidden = true; return; }
    const k = e.key.toLowerCase();
    if (k === " ") { e.preventDefault(); toggle(); }
    else if (k === "r") restart();
    else if (k === "f") fullscreen();
    else if (k === "s") { e.preventDefault(); openPanel(); }
    else if (k === "escape") panel.hidden = true;
    render();
  });
  timeEl.addEventListener("dblclick", fullscreen);

  apply(); remaining = total; start(); render();
  setInterval(render, 100);
</script>
